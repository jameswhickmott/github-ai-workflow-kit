name: Reusable — AI Develop

# Called by target repositories to implement an approved plan and open a PR.
# Supports single-issue mode (issue_number provided) and queue mode (omit issue_number).
#
# IMPORTANT: GH_PAT is required (not optional) — GITHUB_TOKEN cannot push to other repos.
#
# Secrets:
#   GH_PAT            — Personal Access Token with repo write access (REQUIRED)
#   ANTHROPIC_API_KEY — Required when ai_provider: claude
#   OPENAI_API_KEY    — Required when ai_provider: openai | codex | aider

on:
  workflow_call:
    inputs:
      issue_number:
        description: >
          Issue number to implement. Omit (or pass empty string) to activate
          queue mode — processes all open issues with the 'ai:develop' label
          up to max_issues_per_run from the repo config.
        type: string
        required: false
        default: ''
      repo:
        description: Target repository in owner/repo format
        type: string
        required: true
      workflow_kit_repo:
        description: >
          Override the workflow kit repository (owner/repo).
          Defaults to github-ai-workflow-kit in the same org as the target repo.
        type: string
        required: false
        default: ''
      workflow_kit_ref:
        description: Branch, tag, or SHA of the workflow kit to use
        type: string
        required: false
        default: 'main'
    secrets:
      GH_PAT:
        description: GitHub Personal Access Token with repo write access (REQUIRED for branch push)
        required: true
      ANTHROPIC_API_KEY:
        description: Anthropic API key (claude provider)
        required: false
      OPENAI_API_KEY:
        description: OpenAI API key (openai / codex / aider provider)
        required: false

concurrency:
  # Single-issue runs are scoped to the issue; queue runs lock the whole repo
  group: ai-develop-${{ inputs.repo }}-${{ inputs.issue_number || 'queue' }}
  cancel-in-progress: false

jobs:
  develop:
    name: >
      ${{ inputs.issue_number != '' && format('Develop Issue #{0}', inputs.issue_number) || 'Develop Queue' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.GH_PAT }}
          path: target_repo
          fetch-depth: 0   # Full history required for branch operations

      - name: Configure git remote with PAT for push
        run: |
          cd target_repo
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ inputs.repo }}.git"

      - name: Resolve workflow kit repository
        id: kit
        run: |
          if [[ -n "${{ inputs.workflow_kit_repo }}" ]]; then
            echo "repo=${{ inputs.workflow_kit_repo }}" >> "$GITHUB_OUTPUT"
          else
            owner="${{ inputs.repo }}"
            owner="${owner%%/*}"
            echo "repo=${owner}/github-ai-workflow-kit" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout workflow kit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.kit.outputs.repo }}
          ref: ${{ inputs.workflow_kit_ref }}
          token: ${{ secrets.GH_PAT }}
          path: _workflow_kit

      - name: Install AI provider tooling
        run: |
          provider=$(grep -m1 "^ai_provider:" target_repo/.github/ai-workflow.yml 2>/dev/null \
            | sed 's/^ai_provider:[[:space:]]*//' | tr -d '"'"'" | tr -d ' ' \
            || echo "claude")
          echo "Provider: $provider"
          case "$provider" in
            claude)  npm install -g @anthropic-ai/claude-code ;;
            aider)   pip install --quiet aider-chat ;;
            codex)   npm install -g @openai/codex ;;
            openai)  ;;
          esac

      - name: Run AI development
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO: ${{ inputs.repo }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO_DIR: ${{ github.workspace }}/target_repo
          WORKFLOW_KIT_DIR: ${{ github.workspace }}/_workflow_kit
        run: |
          chmod +x _workflow_kit/scripts/ai-common.sh \
                   _workflow_kit/scripts/ai-develop.sh

          if [[ -n "$ISSUE_NUMBER" ]]; then
            _workflow_kit/scripts/ai-develop.sh --issue "$ISSUE_NUMBER"
          else
            _workflow_kit/scripts/ai-develop.sh --queue
          fi
