# AI Develop Wrapper Workflow
# Place this file at .github/workflows/ai-develop.yml in each target repository.
#
# Triggers:
#   1. Label-based  — issue receives 'ai:develop' label (single issue, immediate)
#   2. Comment      — comment contains '/ai develop' (single issue, immediate)
#   3. Scheduled    — cron job drains the 'ai:develop' queue (configurable cadence)
#   4. Manual       — workflow_dispatch with optional issue_number (blank = queue mode)
#
# Required secrets in the target repository:
#   GH_PAT            — GitHub Personal Access Token with repo write access (REQUIRED)
#   ANTHROPIC_API_KEY — Anthropic API key (if using claude provider)
#   OPENAI_API_KEY    — OpenAI API key (if using openai/codex/aider provider)

name: AI Develop

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  schedule:
    # Drain the ai:develop queue every 4 hours. Adjust or remove as needed.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to implement (leave blank for queue mode)'
        required: false
        default: ''

jobs:
  # ── Single issue: label trigger ──────────────────────────────────────────
  develop-on-label:
    name: Develop Issue #${{ github.event.issue.number }} (label)
    if: >
      github.event_name == 'issues' &&
      github.event.label.name == 'ai:develop'
    uses: YOUR_ORG/github-ai-workflow-kit/.github/workflows/reusable-ai-develop.yml@main
    with:
      issue_number: ${{ toJSON(github.event.issue.number) }}
      repo: ${{ github.repository }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # ── Single issue: comment trigger ────────────────────────────────────────
  develop-on-comment:
    name: Develop Issue #${{ github.event.issue.number }} (comment)
    if: >
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '/ai develop') &&
      github.event.issue.pull_request == null
    uses: YOUR_ORG/github-ai-workflow-kit/.github/workflows/reusable-ai-develop.yml@main
    with:
      issue_number: ${{ toJSON(github.event.issue.number) }}
      repo: ${{ github.repository }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # ── Queue mode: scheduled ─────────────────────────────────────────────────
  develop-queue-scheduled:
    name: Develop Queue (scheduled)
    if: github.event_name == 'schedule'
    uses: YOUR_ORG/github-ai-workflow-kit/.github/workflows/reusable-ai-develop.yml@main
    with:
      repo: ${{ github.repository }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # ── Manual dispatch — specific issue ─────────────────────────────────────
  develop-dispatch-single:
    name: Develop Issue #${{ github.event.inputs.issue_number }} (manual)
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.issue_number != ''
    uses: YOUR_ORG/github-ai-workflow-kit/.github/workflows/reusable-ai-develop.yml@main
    with:
      issue_number: ${{ github.event.inputs.issue_number }}
      repo: ${{ github.repository }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # ── Manual dispatch — queue mode ─────────────────────────────────────────
  develop-dispatch-queue:
    name: Develop Queue (manual)
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.issue_number == ''
    uses: YOUR_ORG/github-ai-workflow-kit/.github/workflows/reusable-ai-develop.yml@main
    with:
      repo: ${{ github.repository }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
