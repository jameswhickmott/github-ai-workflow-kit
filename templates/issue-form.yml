# GitHub Issue Form — AI Task
# Place this file at .github/ISSUE_TEMPLATE/ai-task.yml in the target repository.
# Submitting this form automatically applies the 'ai:triage' label,
# which triggers the AI triage workflow.

name: AI Task
description: Submit a task for AI-assisted development
title: "[AI Task]: "
labels:
  - "ai:triage"

body:
  - type: markdown
    attributes:
      value: |
        This issue will be automatically triaged by AI, then reviewed by a human before any code is written.
        Complete all required fields as thoroughly as possible — the more context you provide, the better the result.

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: What needs to be done? Describe the desired outcome clearly and specifically.
      placeholder: |
        Example: Add pagination to the /users endpoint. Currently it returns all users in a single response.
        We need page and limit query parameters, with a default limit of 20 and a maximum of 100.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context and Background
      description: Why is this needed? What problem does it solve? Are there constraints or prior decisions to be aware of?
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: >
        Optional but recommended. List specific, testable conditions that must be true
        for this task to be considered complete.
      placeholder: |
        - [ ] GET /users?page=2&limit=10 returns the correct slice of results
        - [ ] Response includes total_count and has_next_page fields
        - [ ] Invalid limit values return 400 with a clear error message

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: Your rough estimate — AI triage will refine this.
      options:
        - "trivial (< 1 hour)"
        - "small (1–4 hours)"
        - "medium (1–2 days)"
        - "large (3–5 days)"
        - "epic (needs breakdown into smaller issues)"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "low"
        - "medium"
        - "high"
        - "urgent"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched for existing issues covering this request
          required: true
        - label: I understand this will be implemented by AI and must be reviewed by a human before merging
          required: true
